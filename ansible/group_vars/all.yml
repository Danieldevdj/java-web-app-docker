---
# Global variables for all hosts

# System settings
ansible_user: ubuntu
ansible_ssh_private_key_file: ~/.ssh/id_rsa
ansible_python_interpreter: /usr/bin/python3

# Timezone
timezone: UTC

# Common packages
common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - unzip

# NTP settings
ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
