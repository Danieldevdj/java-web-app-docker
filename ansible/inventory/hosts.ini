# Ansible Inventory for On-Premise DevOps Infrastructure (11 Servers)

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3

# Kubernetes Master Nodes (3 nodes for HA)
[k8s_masters]
k8s-master-1 ansible_host=192.168.1.11
k8s-master-2 ansible_host=192.168.1.12
k8s-master-3 ansible_host=192.168.1.13

# Kubernetes Worker Nodes (5 nodes)
[k8s_workers]
k8s-worker-1 ansible_host=192.168.1.21
k8s-worker-2 ansible_host=192.168.1.22
k8s-worker-3 ansible_host=192.168.1.23
k8s-worker-4 ansible_host=192.168.1.24
k8s-worker-5 ansible_host=192.168.1.25

# Load Balancer Nodes (2 nodes for HAProxy + Keepalived)
[loadbalancers]
lb-1 ansible_host=192.168.1.31 keepalived_priority=100 keepalived_state=MASTER
lb-2 ansible_host=192.168.1.32 keepalived_priority=90 keepalived_state=BACKUP

# Monitoring Server (1 node for Prometheus + Grafana)
[monitoring]
monitoring-1 ansible_host=192.168.1.41

# Virtual IP for Load Balancer
[loadbalancers:vars]
virtual_ip=192.168.1.100
haproxy_stats_port=8404

# Kubernetes Cluster
[k8s_cluster:children]
k8s_masters
k8s_workers

# All infrastructure nodes
[infrastructure:children]
loadbalancers
monitoring

# Docker hosts (all nodes except monitoring which may use Docker or native)
[docker_hosts:children]
k8s_cluster
loadbalancers
