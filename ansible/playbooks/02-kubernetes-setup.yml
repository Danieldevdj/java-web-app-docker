---
# Playbook 2: Kubernetes Installation with kubeadm
- name: Prepare all Kubernetes nodes
  hosts: k8s_cluster
  become: yes
  vars:
    k8s_version: "1.28.0-00"
    pod_network_cidr: "10.244.0.0/16"
    
  tasks:
    - name: Disable swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab
      changed_when: false

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Ensure kernel modules load on boot
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Configure sysctl for Kubernetes
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
        mode: '0644'
      notify: Reload sysctl

    - name: Apply sysctl settings
      command: sysctl --system
      changed_when: false

    - name: Install dependencies for Kubernetes
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Add Kubernetes GPG key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      shell: |
        echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /' | tee /etc/apt/sources.list.d/kubernetes.list
      args:
        creates: /etc/apt/sources.list.d/kubernetes.list

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Kubernetes components
      apt:
        name:
          - kubelet={{ k8s_version }}
          - kubeadm={{ k8s_version }}
          - kubectl={{ k8s_version }}
        state: present

    - name: Hold Kubernetes packages at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: yes
        state: started

  handlers:
    - name: Reload sysctl
      command: sysctl --system

- name: Initialize Kubernetes Master (First Master Only)
  hosts: k8s_masters[0]
  become: yes
  vars:
    k8s_version: "1.28.0"
    pod_network_cidr: "10.244.0.0/16"
    control_plane_endpoint: "192.168.1.100:6443"  # HAProxy VIP
    
  tasks:
    - name: Check if Kubernetes is already initialized
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Initialize Kubernetes cluster
      command: >
        kubeadm init
        --control-plane-endpoint={{ control_plane_endpoint }}
        --upload-certs
        --pod-network-cidr={{ pod_network_cidr }}
        --apiserver-advertise-address={{ ansible_default_ipv4.address }}
      when: not k8s_initialized.stat.exists
      register: kubeadm_init

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'

    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Install Calico network plugin
      become_user: "{{ ansible_user }}"
      shell: |
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/tigera-operator.yaml
        kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/custom-resources.yaml
      environment:
        KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
      when: not k8s_initialized.stat.exists

    - name: Get join command for master nodes
      shell: kubeadm token create --print-join-command --certificate-key $(kubeadm init phase upload-certs --upload-certs | tail -1)
      register: k8s_master_join_command
      when: not k8s_initialized.stat.exists

    - name: Get join command for worker nodes
      shell: kubeadm token create --print-join-command
      register: k8s_worker_join_command
      changed_when: false

    - name: Save master join command
      set_fact:
        master_join_command: "{{ k8s_master_join_command.stdout if k8s_master_join_command.stdout is defined else '' }}"
        cacheable: yes

    - name: Save worker join command
      set_fact:
        worker_join_command: "{{ k8s_worker_join_command.stdout }}"
        cacheable: yes

- name: Join additional master nodes to cluster
  hosts: k8s_masters[1:]
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Join master node to cluster
      shell: "{{ hostvars[groups['k8s_masters'][0]]['master_join_command'] }} --control-plane"
      when: 
        - not node_joined.stat.exists
        - hostvars[groups['k8s_masters'][0]]['master_join_command'] is defined
        - hostvars[groups['k8s_masters'][0]]['master_join_command'] != ''

    - name: Create .kube directory for root
      file:
        path: /root/.kube
        state: directory
        mode: '0755'
      when: not node_joined.stat.exists

    - name: Copy admin.conf to root's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        mode: '0600'
      when: not node_joined.stat.exists

    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      when: not node_joined.stat.exists

    - name: Copy admin.conf to user's kube config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: yes
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
      when: not node_joined.stat.exists

- name: Join worker nodes to cluster
  hosts: k8s_workers
  become: yes
  tasks:
    - name: Check if node is already joined
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: node_joined

    - name: Join worker node to cluster
      shell: "{{ hostvars[groups['k8s_masters'][0]]['worker_join_command'] }}"
      when: not node_joined.stat.exists
